version: '3.8'

services:
  tgweb-proxy:
    image: grayhoax/telegram-web-proxy:sha-959b1b5@sha256:5bb3a55cdee2959482f69e24e4c202d52b378968d85e18cd645c2095739ecb45
    container_name: tgweb-proxy
    restart: unless-stopped
    ports:
      # Bind strictly to local loopback interface (protected by Caddy reverse proxy)
      - "127.0.0.1:8080:80"
    environment:
      - TPROXY_HOSTNAME=${TG_DOMAIN}
      - TPROXY_SECRET=${TG_PROXY_SECRET}
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
